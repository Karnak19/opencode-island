name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: false
        default: 'dev'

env:
  APP_NAME: "Opencode Island"
  EXECUTABLE_NAME: "OpencodeIsland"

jobs:
  build:
    runs-on: macos-14
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Get version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "${{ github.event.inputs.version }}" && "${{ github.event.inputs.version }}" != "dev" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Update version in Info.plist
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Sources/Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Sources/Resources/Info.plist

      - name: Build Swift package
        run: swift build -c release

      - name: Create app bundle
        run: |
          APP_DIR="dist/${{ env.APP_NAME }}.app"
          CONTENTS_DIR="${APP_DIR}/Contents"
          MACOS_DIR="${CONTENTS_DIR}/MacOS"
          RESOURCES_DIR="${CONTENTS_DIR}/Resources"
          
          mkdir -p "${MACOS_DIR}"
          mkdir -p "${RESOURCES_DIR}"
          
          # Copy executable
          cp ".build/release/${{ env.EXECUTABLE_NAME }}" "${MACOS_DIR}/${{ env.EXECUTABLE_NAME }}"
          
          # Copy Info.plist
          cp "Sources/Resources/Info.plist" "${CONTENTS_DIR}/Info.plist"
          
          # Copy plugin file
          if [ -f "plugin/opencode-island.ts" ]; then
            cp "plugin/opencode-island.ts" "${RESOURCES_DIR}/opencode-island.ts"
          fi
          
          # Create PkgInfo
          echo -n "APPL????" > "${CONTENTS_DIR}/PkgInfo"
          
          echo "App bundle created at: ${APP_DIR}"

      - name: Create DMG
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DMG_NAME="${{ env.APP_NAME }}-${VERSION}.dmg"
          DMG_PATH="dist/${DMG_NAME}"
          
          # Create a temporary directory for DMG contents
          DMG_TEMP="dist/dmg-temp"
          mkdir -p "${DMG_TEMP}"
          
          # Copy the app to temp directory
          cp -R "dist/${{ env.APP_NAME }}.app" "${DMG_TEMP}/"
          
          # Create symlink to Applications
          ln -s /Applications "${DMG_TEMP}/Applications"
          
          # Create the DMG
          hdiutil create -volname "${{ env.APP_NAME }}" \
            -srcfolder "${DMG_TEMP}" \
            -ov -format UDZO \
            "${DMG_PATH}"
          
          # Clean up
          rm -rf "${DMG_TEMP}"
          
          echo "DMG created at: ${DMG_PATH}"
          echo "dmg_path=${DMG_PATH}" >> $GITHUB_ENV
          echo "dmg_name=${DMG_NAME}" >> $GITHUB_ENV

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ steps.version.outputs.version }}
          path: dist/*.dmg
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.dmg
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

